{% extends 'base.html' %}{% block content %}<section class="page"><div class="page-title"><div><p>复用 D-5：LAG() 获取相邻完成订单间隔，ROW_NUMBER() 定位中位数</p><h1>会员复购分析</h1></div></div><div class="grid"><section class="card"><h2>会员复购间隔分布</h2><canvas id="repurchase"></canvas></section><section class="card"><h2>分析口径</h2><p>按会员的相邻有效订单计算间隔；每位会员使用间隔中位数后再分桶，避免单次极端间隔主导结果。</p></section></div><section class="card table-card"><table><tr><th>复购间隔区间</th><th>会员数</th><th>平均会员中位间隔</th></tr>{% for x in rows %}<tr><td>{{x.segment}}</td><td>{{x.members}}</td><td>{{x.avg_gap}} 天</td></tr>{% endfor %}</table></section></section><script>const d={{chart|safe}};new Chart(repurchase,{type:'doughnut',data:{labels:d.map(x=>x.segment),datasets:[{data:d.map(x=>x.members),backgroundColor:['#13a5a5','#0b5fa5','#dca942','#7b89b5']}]}});</script>{% endblock %}
