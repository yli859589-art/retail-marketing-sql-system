{% extends 'base.html' %}{% block content %}<section class="page"><div class="page-title"><div><p>仅统计已完成订单；销售金额使用订单明细成交价快照</p><h1>销售分析</h1></div></div><div class="grid"><section class="card"><h2>月度销售趋势</h2><canvas id="monthly"></canvas></section><section class="card"><h2>品类销售排行</h2><canvas id="categories"></canvas></section></div><section class="card table-card"><h2>商品销售 TOP 15</h2><table><tr><th>商品</th><th>销量</th><th>销售金额</th><th>订单覆盖数</th></tr>{% for x in products %}<tr><td>#{{x.product_id}} {{x.product_name}}</td><td>{{x.quantity}}</td><td>¥{{x.sales|money}}</td><td>{{x.order_count}}</td></tr>{% endfor %}</table></section></section><script>const d={{chart|safe}};new Chart(monthly,{type:'line',data:{labels:d.monthly.map(x=>x.label),datasets:[{label:'销售额',data:d.monthly.map(x=>x.sales),borderColor:'#007c91'}]}});new Chart(categories,{type:'bar',data:{labels:d.categories.map(x=>x.category_name),datasets:[{label:'销售额',data:d.categories.map(x=>x.sales),backgroundColor:'#dca942'}]},options:{indexAxis:'y'}});</script>{% endblock %}
